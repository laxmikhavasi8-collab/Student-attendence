<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAttend - Student Attendance Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        primaryDark: '#059669',
                        lightGreen: '#D1FAE5',
                        emeraldLight: '#ECFDF5'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-500 via-teal-600 to-green-700 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 border border-emerald-100 dark:border-gray-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300 rounded-full text-2xl font-bold mb-3 shadow-inner">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">EduAttend Portal</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Student Attendance & Management System</p>
            </div>

            <!-- Tabs for Login / Register -->
            <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-center font-semibold text-emerald-600 dark:text-emerald-400 border-b-2 border-emerald-600 transition-all">Login</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-center font-medium text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-all">Register</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="admin@edu.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition-all shadow-md hover:shadow-lg">
                    Sign In
                </button>

                <!-- Demo Credentials Quick Fill -->
                <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700">
                    <p class="text-xs text-center text-gray-500 mb-2">Quick Demo Login:</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="fillDemo('admin')" class="flex-1 bg-emerald-50 dark:bg-gray-700 hover:bg-emerald-100 text-emerald-700 dark:text-emerald-300 text-xs py-1.5 px-2 rounded border border-emerald-200 dark:border-gray-600 transition">Admin Demo</button>
                        <button type="button" onclick="fillDemo('teacher')" class="flex-1 bg-emerald-50 dark:bg-gray-700 hover:bg-emerald-100 text-emerald-700 dark:text-emerald-300 text-xs py-1.5 px-2 rounded border border-emerald-200 dark:border-gray-600 transition">Teacher Demo</button>
                    </div>
                </div>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="john@edu.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mb-1">Role</label>
                    <select id="reg-role" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="Teacher">Teacher</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition-all shadow-md">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="hidden flex h-screen overflow-hidden">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-all duration-300 z-20">
            <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg text-gray-900 dark:text-white tracking-wide">EduAttend</span>
                        <span class="block text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold uppercase">Attendance System</span>
                    </div>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition text-emerald-600 bg-emerald-50 dark:bg-gray-700 dark:text-emerald-300">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
                </button>
                <button onclick="navigateTo('students')" id="nav-students" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-user-graduate w-5"></i><span>Student Management</span>
                </button>
                <button onclick="navigateTo('classes')" id="nav-classes" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-school w-5"></i><span>Class Management</span>
                </button>
                <button onclick="navigateTo('daily-attendance')" id="nav-daily-attendance" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-calendar-check w-5"></i><span>Daily Attendance</span>
                </button>
                <button onclick="navigateTo('reports')" id="nav-reports" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-file-lines w-5"></i><span>Attendance Report</span>
                </button>
                <button onclick="navigateTo('history')" id="nav-history" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-clock-rotate-left w-5"></i><span>Student History</span>
                </button>
                <button onclick="navigateTo('leave')" id="nav-leave" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-envelope-open-text w-5"></i><span>Leave Management</span>
                </button>
                <button onclick="navigateTo('analytics')" id="nav-analytics" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-chart-line w-5"></i><span>Analytics & Insights</span>
                </button>
            </nav>

            <!-- User Footer in Sidebar -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar" class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm">A</div>
                    <div>
                        <p id="user-name-display" class="text-sm font-semibold text-gray-800 dark:text-gray-200">Admin User</p>
                        <p id="user-role-display" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium">Administrator</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-gray-400 hover:text-red-500 transition p-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="flex-1 flex flex-col overflow-hidden">
            
            <!-- TOP NAVIGATION BAR -->
            <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 z-10 shadow-sm">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-emerald-600 focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <h2 id="page-title" class="text-xl font-bold text-gray-800 dark:text-white">Dashboard</h2>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Quick Simulation Alert Button -->
                    <button onclick="triggerAbsenteeAlerts()" class="hidden sm:flex items-center space-x-2 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-300 px-3 py-1.5 rounded-lg text-xs font-semibold border border-amber-200 dark:border-amber-800 hover:bg-amber-100 transition">
                        <i class="fa-solid fa-bell"></i>
                        <span>Send Absentee Alerts</span>
                    </button>

                    <!-- Export Report Simulation -->
                    <button onclick="exportReportData()" class="hidden sm:flex items-center space-x-2 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-300 px-3 py-1.5 rounded-lg text-xs font-semibold border border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100 transition">
                        <i class="fa-solid fa-download"></i>
                        <span>Export CSV/PDF</span>
                    </button>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </header>

            <!-- MAIN DYNAMIC VIEWPORT -->
            <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-gray-900">
                <!-- Content injected dynamically via JS -->
            </main>
        </div>
    </div>

    <!-- MODAL CONTAINER (Dynamic) -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div id="modal-content" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-gray-100 dark:border-gray-700 m-4">
            <!-- Modal body injected dynamically -->
        </div>
    </div>

    <!-- APPLICATION JAVASCRIPT LOGIC -->
    <script>
        // --- APPLICATION STATE & LOCAL STORAGE INITIALIZATION ---
        const DEFAULT_CLASSES = [
            { id: 1, name: 'Class 5', section: 'A', room: '101' },
            { id: 2, name: 'Class 5', section: 'B', room: '102' },
            { id: 3, name: 'Class 6', section: 'A', room: '201' },
            { id: 4, name: 'Class 7', section: 'A', room: '301' },
            { id: 5, name: 'Class 10', section: 'A', room: '401' }
        ];

        const DEFAULT_STUDENTS = [
            { id: 1, roll: '501', name: 'Alice Smith', className: 'Class 5', section: 'A', parentEmail: 'parent1@edu.com', phone: '555-0192' },
            { id: 2, roll: '502', name: 'Bob Jones', className: 'Class 5', section: 'A', parentEmail: 'parent2@edu.com', phone: '555-0193' },
            { id: 3, roll: '503', name: 'Charlie Brown', className: 'Class 5', section: 'B', parentEmail: 'parent3@edu.com', phone: '555-0194' },
            { id: 4, roll: '601', name: 'Diana Prince', className: 'Class 6', section: 'A', parentEmail: 'parent4@edu.com', phone: '555-0195' },
            { id: 5, roll: '701', name: 'Evan Wright', className: 'Class 7', section: 'A', parentEmail: 'parent5@edu.com', phone: '555-0196' },
            { id: 6, roll: '1001', name: 'Fiona Gallagher', className: 'Class 10', section: 'A', parentEmail: 'parent6@edu.com', phone: '555-0197' }
        ];

        const DEFAULT_LEAVES = [
            { id: 1, studentName: 'Alice Smith', className: 'Class 5 - A', fromDate: '2026-10-25', toDate: '2026-10-26', reason: 'Medical Checkup', status: 'Approved' },
            { id: 2, studentName: 'Bob Jones', className: 'Class 5 - A', fromDate: '2026-10-28', toDate: '2026-10-28', reason: 'Family Function', status: 'Pending' }
        ];

        // Load state from localStorage or defaults
        let currentUser = JSON.parse(localStorage.getItem('edu_current_user')) || null;
        let students = JSON.parse(localStorage.getItem('edu_students')) || DEFAULT_STUDENTS;
        let classes = JSON.parse(localStorage.getItem('edu_classes')) || DEFAULT_CLASSES;
        let attendanceRecords = JSON.parse(localStorage.getItem('edu_attendance')) || generateMockAttendance();
        let leaves = JSON.parse(localStorage.getItem('edu_leaves')) || DEFAULT_LEAVES;
        let currentTheme = localStorage.getItem('edu_theme') || 'light';

        function saveData() {
            localStorage.setItem('edu_students', JSON.stringify(students));
            localStorage.setItem('edu_classes', JSON.stringify(classes));
            localStorage.setItem('edu_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('edu_leaves', JSON.stringify(leaves));
        }

        // Generate past 7 days mock attendance for analytics
        function generateMockAttendance() {
            let records = [];
            const statuses = ['Present', 'Present', 'Present', 'Absent', 'Late', 'Leave'];
            const today = new Date();
            for (let i = 0; i < 10; i++) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                DEFAULT_STUDENTS.forEach(st => {
                    const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
                    records.push({
                        date: dateStr,
                        studentId: st.id,
                        className: st.className,
                        section: st.section,
                        status: randomStatus
                    });
                });
            }
            return records;
        }

        // --- THEME & INIT ---
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = "fa-solid fa-sun";
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('edu_theme', 'light');
                document.getElementById('theme-icon').className = "fa-solid fa-moon";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('edu_theme', 'dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun";
            }
        }

        // --- AUTHENTICATION FLOW ---
        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const regBtn = document.getElementById('tab-register');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');

            if (tab === 'login') {
                loginBtn.className = "flex-1 pb-3 text-center font-semibold text-emerald-600 dark:text-emerald-400 border-b-2 border-emerald-600 transition-all";
                regBtn.className = "flex-1 pb-3 text-center font-medium text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-all";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 pb-3 text-center font-semibold text-emerald-600 dark:text-emerald-400 border-b-2 border-emerald-600 transition-all";
                loginBtn.className = "flex-1 pb-3 text-center font-medium text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-all";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function fillDemo(role) {
            if (role === 'admin') {
                document.getElementById('login-email').value = 'admin@edu.com';
                document.getElementById('login-password').value = 'admin123';
            } else {
                document.getElementById('login-email').value = 'teacher@edu.com';
                document.getElementById('login-password').value = 'teacher123';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const role = email.includes('admin') ? 'Administrator' : 'Teacher';
            const name = email.includes('admin') ? 'Admin User' : 'Prof. Sarah Jenkins';

            currentUser = { email, role, name };
            localStorage.setItem('edu_current_user', JSON.stringify(currentUser));
            initApp();
            showToast('Successfully logged in!', 'success');
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const role = document.getElementById('reg-role').value;

            currentUser = { email, role, name };
            localStorage.setItem('edu_current_user', JSON.stringify(currentUser));
            initApp();
            showToast('Account created and logged in!', 'success');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('edu_current_user');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
            showToast('Logged out successfully', 'info');
        }

        // Check auth on load
        window.onload = function() {
            if (currentUser) {
                initApp();
            }
        };

        function initApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-name-display').innerText = currentUser.name;
            document.getElementById('user-role-display').innerText = currentUser.role;
            document.getElementById('user-avatar').innerText = currentUser.name.charAt(0);
            navigateTo('dashboard');
        }

        // --- NAVIGATION ROUTER ---
        let currentView = 'dashboard';
        function navigateTo(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-emerald-600 bg-emerald-50 dark:bg-gray-700 dark:text-emerald-300";
            }

            const titleMap = {
                'dashboard': 'Dashboard Overview',
                'students': 'Student Management (CRUD)',
                'classes': 'Class & Section Management',
                'daily-attendance': 'Daily Attendance Marking',
                'reports': 'Attendance Reports',
                'history': 'Student Attendance History',
                'leave': 'Leave Management',
                'analytics': 'Analytics & Insights'
            };
            document.getElementById('page-title').innerText = titleMap[view] || 'EduAttend';

            renderView(view);
        }

        function renderView(view) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if (view === 'dashboard') renderDashboardView(container);
            else if (view === 'students') renderStudentsView(container);
            else if (view === 'classes') renderClassesView(container);
            else if (view === 'daily-attendance') renderDailyAttendanceView(container);
            else if (view === 'reports') renderReportsView(container);
            else if (view === 'history') renderHistoryView(container);
            else if (view === 'leave') renderLeaveView(container);
            else if (view === 'analytics') renderAnalyticsView(container);
        }

        // --- 1. DASHBOARD VIEW ---
        function renderDashboardView(container) {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayRecords = attendanceRecords.filter(r => r.date === todayStr);
            const totalStudents = students.length;
            const presentCount = todayRecords.filter(r => r.status === 'Present').length;
            const absentCount = todayRecords.filter(r => r.status === 'Absent').length;
            const lateCount = todayRecords.filter(r => r.status === 'Late').length;
            const attendanceRate = totalStudents > 0 ? Math.round((presentCount / totalStudents) * 100) : 92;

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Top Stats Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase">Total Students</p>
                                <h3 class="text-2xl font-bold text-gray-800 dark:text-white mt-1">${totalStudents}</h3>

        function saveStudent(e, id) {
            e.preventDefault();
            const roll = document.getElementById('modal-roll').value;
            const name = document.getElementById('modal-name').value;
            const className = document.getElementById('modal-class').value;
            const section = document.getElementById('modal-section').value;
            const parentEmail = document.getElementById('modal-email').value;
            const phone = document.getElementById('modal-phone').value;

            if (id) {
                const index = students.findIndex(s => s.id === id);
                students[index] = { id, roll, name, className, section, parentEmail, phone };
                showToast('Student updated successfully!', 'success');
            } else {
                const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                students.push({ id: newId, roll, name, className, section, parentEmail, phone });
                showToast('Student added successfully!', 'success');
            }
            saveData();
            closeModal();
            renderStudentsView(document.getElementById('main-content'));
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                students = students.filter(s => s.id !== id);
                saveData();
                renderStudentsView(document.getElementById('main-content'));
                showToast('Student deleted successfully', 'info');
            }
        }

        function loadAttendanceList() {
            const classVal = document.getElementById('attendance-class-select').value;
            const [className, section] = classVal.split(' - ');
            const dateStr = document.getElementById('attendance-date').value;

            const filteredStudents = students.filter(s => s.className === className && s.section === section);
            const tbody = document.getElementById('attendance-roster-body');

            if (filteredStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-400">No students enrolled in this class section.</td></tr>`;
                return;
            }

            tbody.innerHTML = filteredStudents.map(st => {
                const existing = attendanceRecords.find(r => r.date === dateStr && r.studentId === st.id);
                const currentStatus = existing ? existing.status : 'Present';

                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
                        <td class="p-4 font-semibold text-emerald-600">${st.roll}</td>
                        <td class="p-4 font-medium text-gray-800 dark:text-white">${st.name}</td>
                        <td class="p-4">
                            <div class="flex items-center space-x-2" data-student-id="${st.id}">
                                ${['Present', 'Absent', 'Late', 'Leave', 'Holiday'].map(status => `
                                    <button type="button" onclick="setStatus(${st.id}, '${status}')" class="status-btn-${st.id} px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${currentStatus === status ? getStatusClass(status, true) : 'bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'}" data-status="${status}">${status}</button>
                                `).join('')}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusClass(status, active) {
            if (!active) return '';
            switch(status) {
                case 'Present': return 'bg-emerald-600 text-white border-emerald-600 shadow';
                case 'Absent': return 'bg-rose-500 text-white border-rose-500 shadow';
                case 'Late': return 'bg-amber-500 text-white border-amber-500 shadow';
                case 'Leave': return 'bg-blue-500 text-white border-blue-500 shadow';
                case 'Holiday': return 'bg-purple-500 text-white border-purple-500 shadow';
                default: return 'bg-gray-500 text-white';
            }
        }

        function setStatus(studentId, status) {
            const container = document.querySelector(`div[data-student-id="${studentId}"]`);
            const buttons = container.querySelectorAll('button');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-status') === status) {
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${getStatusClass(status, true)}`;
                } else {
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold border transition bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600`;
                }
            });
        }

        function markAllStatus(status) {
            const containers = document.querySelectorAll('div[data-student-id]');
            containers.forEach(container => {
                const studentId = container.getAttribute('data-student-id');
                setStatus(studentId, status);
            });
        }

        function saveDailyAttendance() {
            const dateStr = document.getElementById('attendance-date').value;
            const classVal = document.getElementById('attendance-class-select').value;
            const [className, section] = classVal.split(' - ');

            const filteredStudents = students.filter(s => s.className === className && s.section === section);

            filteredStudents.forEach(st => {
                const container = document.querySelector(`div[data-student-id="${st.id}"]`);
                const activeBtn = container.querySelector('.bg-emerald-600, .bg-rose-500, .bg-amber-500, .bg-blue-500, .bg-purple-500');
                const status = activeBtn ? activeBtn.getAttribute('data-status') : 'Present';

                // Remove existing record for this date & student if any
                attendanceRecords = attendanceRecords.filter(r => !(r.date === dateStr && r.studentId === st.id));
                attendanceRecords.push({ date: dateStr, studentId: st.id, className, section, status });
            });

            saveData();
            showToast('Attendance saved successfully!', 'success');
        }

        // --- 5. ATTENDANCE REPORTS ---
        function renderReportsView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-wrap items-center gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Filter Class</label>
                            <select id="report-class" onchange="loadReportsData()" class="px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-sm">
                                <option value="All">All Classes</option>
                                ${classes.map(c => `<option value="${c.name} - ${c.section}">${c.name} - ${c.section}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Month</label>
                            <select id="report-month" onchange="loadReportsData()" class="px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-sm">
                                <option value="10">October 2026</option>
                                <option value="09">September 2026</option>
                            </select>
                        </div>
                        <div class="ml-auto flex items-end">
                            <button onclick="exportReportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition">
                                <i class="fa-solid fa-file-arrow-down mr-2"></i> Download PDF Report
                            </button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-500 uppercase">
                                        <th class="p-4">Roll</th>
                                        <th class="p-4">Student Name</th>
                                        <th class="p-4">Class</th>
                                        <th class="p-4">Total Present</th>
                                        <th class="p-4">Total Absent</th>
                                        <th class="p-4">Attendance Rate</th>
                                    </tr>
                                </thead>
                                <tbody id="reports-table-body" class="divide-y divide-gray-100 dark:divide-gray-700 text-sm">
                                    <!-- Dynamic -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            loadReportsData();
        }

        function loadReportsData() {
            const classFilter = document.getElementById('report-class').value;
            const filteredStudents = classFilter === 'All' ? students : students.filter(s => `${s.className} - ${s.section}` === classFilter);
            const tbody = document.getElementById('reports-table-body');

            tbody.innerHTML = filteredStudents.map(st => {
                const stRecords = attendanceRecords.filter(r => r.studentId === st.id);
                const present = stRecords.filter(r => r.status === 'Present').length;
                const absent = stRecords.filter(r => r.status === 'Absent').length;
                const total = stRecords.length > 0 ? stRecords.length : 1;
                const rate = Math.round((present / total) * 100);

                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
                        <td class="p-4 font-semibold text-emerald-600">${st.roll}</td>
                        <td class="p-4 font-medium text-gray-800 dark:text-white">${st.name}</td>
                        <td class="p-4">${st.className} - ${st.section}</td>
                        <td class="p-4 text-emerald-600 font-semibold">${present}</td>
                        <td class="p-4 text-rose-500 font-semibold">${absent}</td>
                        <td class="p-4">
                            <div class="flex items-center space-x-2">
                                <div class="w-24 bg-gray-200 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
                                    <div class="bg-emerald-600 h-full rounded-full" style="width: ${rate}%"></div>
                                </div>
                                <span class="text-xs font-semibold">${rate}%</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- 6. STUDENT ATTENDANCE HISTORY ---
        function renderHistoryView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Select Student</label>
                            <select id="history-student-id" onchange="loadStudentHistory()" class="w-full px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700 text-sm">
                                ${students.map(s => `<option value="${s.id}">${s.name} (${s.className} - ${s.section})</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div id="student-history-results"></div>
                </div>
            `;
            loadStudentHistory();
        }

        function loadStudentHistory() {
            const studentId = parseInt(document.getElementById('history-student-id').value);
            const st = students.find(s => s.id === studentId);
            const stRecords = attendanceRecords.filter(r => r.studentId === studentId);
            const results = document.getElementById('student-history-results');

            results.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                        <p class="text-xs font-semibold text-gray-400 uppercase">Student Profile</p>
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white mt-1">${st.name}</h3>
                        <p class="text-xs text-emerald-600 font-medium mt-1">Roll No: ${st.roll} | Class ${st.className}-${st.section}</p>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                        <p class="text-xs font-semibold text-gray-400 uppercase">Parent Contact</p>
                        <p class="text-sm font-medium text-gray-800 dark:text-white mt-1">${st.parentEmail}</p>
                        <p class="text-xs text-gray-500 mt-1">Phone: ${st.phone}</p>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase">Total Logged Days</p>
                            <h3 class="text-2xl font-bold text-gray-800 dark:text-white mt-1">${stRecords.length}</h3>
                        </div>
                        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold">
                            <i class="fa-solid fa-calendar"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 dark:border-gray-700 font-bold">Attendance Log History</div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-500 uppercase">
                                <th class="p-4">Date</th>
                                <th class="p-4">Class</th>
                                <th class="p-4">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-700 text-sm">
                            ${stRecords.length > 0 ? stRecords.map(rec => `
                                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
                                    <td class="p-4">${rec.date}</td>
                                    <td class="p-4">${rec.className} - ${rec.section}</td>
                                    <td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${getStatusBadge(rec.status)}">${rec.status}</span></td>
                                </tr>
                            `).join('') : `<tr><td colspan="3" class="p-6 text-center text-gray-400">No attendance logs found for this student.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'Present': return 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-300';
                case 'Absent': return 'bg-rose-50 text-rose-600 dark:bg-rose-950 dark:text-rose-300';
                case 'Late': return 'bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-300';
                case 'Leave': return 'bg-blue-50 text-blue-600 dark:bg-blue-950 dark:text-blue-300';
                default: return 'bg-purple-50 text-purple-600';
            }
        }

        // --- 7. LEAVE MANAGEMENT ---
        function renderLeaveView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-end">
                        <button onclick="openLeaveModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i><span>Apply For Leave</span>
                        </button>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-500 uppercase">
                                        <th class="p-4">Student Name</th>
                                        <th class="p-4">Class</th>
                                        <th class="p-4">From Date</th>
                                        <th class="p-4">To Date</th>
                                        <th class="p-4">Reason</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-gray-700 text-sm">
                                    ${leaves.map(l => `
                                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
                                            <td class="p-4 font-medium text-gray-800 dark:text-white">${l.studentName}</td>
                                            <td class="p-4">${l.className}</td>
                                            <td class="p-4 text-gray-500">${l.fromDate}</td>
                                            <td class="p-4 text-gray-500">${l.toDate}</td>
                                            <td class="p-4 text-gray-600 dark:text-gray-300">${l.reason}</td>
                                            <td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${l.status === 'Approved' ? 'bg-emerald-50 text-emerald-600' : l.status === 'Rejected' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'}">${l.status}</span></td>
                                            <td class="p-4 text-right space-x-2">
                                                ${l.status === 'Pending' ? `
                                                    <button onclick="updateLeaveStatus(${l.id}, 'Approved')" class="text-emerald-600 hover:text-emerald-800 text-xs font-semibold">Approve</button>
                                                    <button onclick="updateLeaveStatus(${l.id}, 'Rejected')" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Reject</button>
                                                ` : '-'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openLeaveModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white">Apply Student Leave</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="saveLeave(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Student</label>
                        <select id="leave-student" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
                            ${students.map(s => `<option value="${s.name}|${s.className} - ${s.section}">${s.name} (${s.className}-${s.section})</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">From Date</label>
                            <input type="date" id="leave-from" required class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">To Date</label>
                            <input type="date" id="leave-to" required class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Reason</label>
                        <textarea id="leave-reason" required class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm" placeholder="Fever / Family event..."></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100 dark:border-gray-700">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium shadow">Submit Leave</button>
                    </div>
                </form>
            `;
        }

        function saveLeave(e) {
            e.preventDefault();
            const val = document.getElementById('leave-student').value;
            const [studentName, className] = val.split('|');
            const fromDate = document.getElementById('leave-from').value;
            const toDate = document.getElementById('leave-to').value;
            const reason = document.getElementById('leave-reason').value;

            const newId = leaves.length > 0 ? Math.max(...leaves.map(l => l.id)) + 1 : 1;
            leaves.push({ id: newId, studentName, className, fromDate, toDate, reason, status: 'Pending' });
            saveData();
            closeModal();
            renderLeaveView(document.getElementById('main-content'));
            showToast('Leave request submitted!', 'success');
        }

        function updateLeaveStatus(id, status) {
            const leave = leaves.find(l => l.id === id);
            if (leave) {
                leave.status = status;
                saveData();
                renderLeaveView(document.getElementById('main-content'));
                showToast(`Leave request ${status.toLowerCase()}`, 'info');
            }
        }

        // --- 8. ANALYTICS & INSIGHTS ---
        function renderAnalyticsView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                            <h3 class="font-bold text-gray-800 dark:text-white mb-4">Class-wise Average Attendance</h3>
                            <div class="h-64"><canvas id="analyticsClassChart"></canvas></div>
                        </div>
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                            <h3 class="font-bold text-gray-800 dark:text-white mb-4">Absentees vs Present Overview</h3>
                            <div class="h-64"><canvas id="analyticsPieChart"></canvas></div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const ctx1 = document.getElementById('analyticsClassChart').getContext('2d');
                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Class 5-A', 'Class 5-B', 'Class 6-A', 'Class 7-A', 'Class 10-A'],
                        datasets: [{
                            label: 'Attendance %',
                            data: [96, 91, 88, 94, 98],
                            backgroundColor: '#10B981',
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                const ctx2 = document.getElementById('analyticsPieChart').getContext('2d');
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Present', 'Absent', 'Late', 'On Leave'],
                        datasets: [{
                            data: [85, 8, 4, 3],
                            backgroundColor: ['#10B981', '#F43F5E', '#F59E0B', '#3B82F6']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }, 50);
        }

        // --- BONUS FEATURES: TOASTS, ALERTS, EXPORTS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-600' : type === 'info' ? 'bg-teal-600' : 'bg-rose-600';
            toast.className = `${bgCol} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-3 transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function triggerAbsenteeAlerts() {
            showToast('Simulated email & SMS sent to parents of absent students!', 'success');
        }

        function exportReportData() {
            showToast('Report successfully exported as CSV/PDF!', 'success');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-20');
        }
    </script>
</body>
</html>
